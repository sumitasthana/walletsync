<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WalletSync</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #10141c;
    --panel2: #151a24;
    --border: #1f2630;
    --text: #d7dee8;
    --dim: #8a94a6;
    --accent: #3ddc84;
    --accent2: #f5b455;
    --user: #3ddc84;
    --mono: "Cascadia Mono", "Consolas", "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--mono); font-size: 14px; height: 100vh;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; align-items: baseline; gap: 14px;
    padding: 12px 18px; border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header .logo { color: var(--accent); font-weight: bold; font-size: 16px; }
  header .tagline { color: var(--dim); font-size: 12px; }
  header .live-dot {
    margin-left: auto; font-size: 11px; color: var(--dim);
  }
  main {
    flex: 1; display: grid; grid-template-columns: 1fr 430px;
    gap: 0; min-height: 0;
  }
  /* chat side */
  #chat { display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--border); }
  #log { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 78%; line-height: 1.55; white-space: pre-wrap; word-wrap: break-word; }
  .msg .who { font-size: 11px; color: var(--dim); margin-bottom: 3px; }
  .msg.user { align-self: flex-end; text-align: right; }
  .msg.user .bubble { color: var(--user); }
  .msg.agent .bubble { color: var(--text); }
  .msg .bubble { padding: 10px 12px; background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; text-align: left; }
  .typing { color: var(--dim); padding: 6px 0; }
  .typing span { animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
  #inputbar {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 16px; border-top: 1px solid var(--border); background: var(--panel);
  }
  #inputbar .prompt { color: var(--accent); white-space: nowrap; font-size: 13px; }
  #msg {
    flex: 1; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); font-family: var(--mono); font-size: 14px;
    padding: 10px 12px; border-radius: 6px; outline: none;
  }
  #msg:focus { border-color: var(--accent); }
  #send {
    background: var(--accent); color: #06220f; border: none; font-family: var(--mono);
    font-weight: bold; padding: 10px 16px; border-radius: 6px; cursor: pointer;
  }
  #send:disabled { opacity: 0.4; cursor: wait; }
  /* matches side */
  #side { display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
  #side .side-head {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    color: var(--dim); font-size: 12px; letter-spacing: 0.4px;
  }
  #match-source { color: var(--accent2); }
  #matches { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .card-tile {
    background: var(--panel2); border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden; position: relative;
  }
  .card-tile.top { border-color: var(--accent); }
  .card-tile .rank {
    position: absolute; top: 8px; left: 8px; z-index: 2;
    background: rgba(11,14,20,0.85); color: var(--accent); font-size: 11px;
    padding: 2px 7px; border-radius: 4px; border: 1px solid var(--accent);
  }
  .card-tile img { width: 100%; display: block; background: #fff; }
  .card-tile .noimg {
    width: 100%; aspect-ratio: 640/400; display: flex; align-items: center;
    justify-content: center; background: #1c2330; color: var(--dim); font-size: 22px;
  }
  .card-tile .body { padding: 10px 12px 12px; }
  .card-tile .name { font-weight: bold; margin-bottom: 4px; }
  .card-tile .bank { font-size: 11px; color: var(--dim); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
  .badges { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
  .badge {
    font-size: 11px; background: rgba(61,220,132,0.12); color: var(--accent);
    border: 1px solid rgba(61,220,132,0.35); padding: 2px 7px; border-radius: 4px;
  }
  .badge.activation { color: var(--accent2); border-color: rgba(245,180,85,0.4); background: rgba(245,180,85,0.1); }
  .meta { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11px; color: var(--dim); }
  .scorebar { height: 4px; background: var(--border); border-radius: 2px; margin-top: 10px; overflow: hidden; }
  .scorebar .fill { height: 100%; background: var(--accent); border-radius: 2px; }
  .empty { color: var(--dim); padding: 20px; text-align: center; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>
<header>
  <span class="logo">walletsync</span>
  <span class="tagline">match cards to how you spend</span>
  <span class="live-dot" id="status">ready</span>
</header>
<main>
  <div id="chat">
    <div id="log"></div>
    <form id="inputbar" autocomplete="off">
      <span class="prompt">you@walletsync:~$</span>
      <input id="msg" placeholder="type your needs, e.g. I commute, mostly gas and groceries" autofocus>
      <button id="send" type="submit">send</button>
    </form>
  </div>
  <div id="side">
    <div class="side-head">BEST MATCHES <span id="match-source"></span></div>
    <div id="matches"><div class="empty">start typing to see matching cards</div></div>
  </div>
</main>
<script>
const history = [];
let debounceTimer = null;
let busy = false;

function el(id) { return document.getElementById(id); }
function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c => ({"&":"&","<":"<",">":">","\"":""","'":"&#39;"}[c]));
}
function fmtRate(c, m) { return m.rate + (c.reward_currency === "Cash Back" ? "%" : "x"); }

function appendMsg(role, text) {
  const log = el("log");
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.innerHTML = "<div class='who'>" + (role === "user" ? "you" : "walletsync") + "</div>" +
                  "<div class='bubble'>" + escapeHtml(text) + "</div>";
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function typingOn() {
  const t = document.createElement("div");
  t.className = "typing"; t.id = "typing";
  t.innerHTML = "<span>&#9679;</span> <span>&#9679;</span> <span>&#9679;</span>";
  el("log").appendChild(t);
  el("log").scrollTop = el("log").scrollHeight;
}
function typingOff() { const t = el("typing"); if (t) t.remove(); }

function cardTile(c, i, maxScore) {
  const tile = document.createElement("div");
  tile.className = "card-tile" + (i === 0 ? " top" : "");
  const img = c.has_image
    ? "<img src='/card-images/" + encodeURIComponent(c.bank) + "/" + encodeURIComponent(c.card_id) + ".png' alt='' loading='lazy' onerror=\"this.outerHTML='<div class=noimg>no image</div>'\">"
    : "<div class='noimg'>no image</div>";
  const badges = (c.matched || []).map(m =>
    "<span class='badge" + (m.requires_activation ? " activation" : "") + "'>" +
    escapeHtml(m.category) + " " + m.rate + (m.requires_activation ? " *" : "") +
    (m.cap_usd ? " (cap $" + m.cap_usd.toLocaleString() + ")" : "") + "</span>").join("");
  const meta = [];
  if (c.annual_fee_usd !== null && c.annual_fee_usd !== undefined) meta.push("$" + c.annual_fee_usd + " annual fee");
  if (c.foreign_transaction_fee_pct !== null && c.foreign_transaction_fee_pct !== undefined)
    meta.push(c.foreign_transaction_fee_pct + "% foreign txn fee");
  meta.push(c.data_quality_tier || "");
  const pct = maxScore > 0 ? Math.max(4, Math.round(100 * c.score / maxScore)) : 0;
  tile.innerHTML =
    (i === 0 ? "<div class='rank'>BEST MATCH</div>" : "") + img +
    "<div class='body'>" +
    "<div class='name'>" + escapeHtml(c.card_name) + "</div>" +
    "<div class='bank'>" + escapeHtml(c.bank) + "</div>" +
    "<div class='badges'>" + badges + "</div>" +
    "<div class='meta'>" + meta.filter(Boolean).map(escapeHtml).join(" &middot; ") + "</div>" +
    "<div class='scorebar'><div class='fill' style='width:" + pct + "%'></div></div>" +
    "</div>";
  return tile;
}

function renderMatches(cards, source) {
  el("match-source").textContent = source === "live" ? "[live]" : "[agent]";
  const wrap = el("matches");
  wrap.innerHTML = "";
  if (!cards || !cards.length) {
    wrap.innerHTML = "<div class='empty'>no matches</div>";
    return;
  }
  const maxScore = Math.max(...cards.map(c => c.score), 0.001);
  cards.forEach((c, i) => wrap.appendChild(cardTile(c, i, maxScore)));
}

async function liveMatch(text) {
  if (!text.trim()) return;
  try {
    const res = await fetch("/api/match", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({text: text})
    });
    const data = await res.json();
    renderMatches(data.matches, "live");
    el("status").textContent = "live matching";
  } catch (e) { /* ignore transient errors while typing */ }
}

el("msg").addEventListener("input", () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => liveMatch(el("msg").value), 350);
});

el("inputbar").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (busy) return;
  const text = el("msg").value.trim();
  if (!text) return;
  clearTimeout(debounceTimer);
  el("msg").value = "";
  appendMsg("user", text);
  history.push({role: "user", content: text});
  busy = true; el("send").disabled = true; el("status").textContent = "thinking";
  typingOn();
  try {
    const res = await fetch("/api/chat", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message: text, history: history.slice(0, -1)})
    });
    const data = await res.json();
    typingOff();
    if (data.reply) appendMsg("agent", data.reply);
    if (data.cards && data.cards.length) renderMatches(data.cards, "agent");
    history.push({role: "assistant", content: data.reply || ""});
  } catch (err) {
    typingOff();
    appendMsg("agent", "connection error: " + err);
  }
  busy = false; el("send").disabled = false; el("status").textContent = "ready";
  el("msg").focus();
});
</script>
</body>
</html>
